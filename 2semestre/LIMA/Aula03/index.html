<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <center><h1>Formulário de Cadastro</h1></center>
    <p style="font-family: 'Times New Roman'; font-size: 20px; color: red;">Realize o cadastro e concorra a prêmios</p>
    <form>
        <label>Nome Completo</label>
        <input type = "text" placeholder="insira seu nome" required/>
        <br></br>
        <label>Data de Nascimento</label>
        <input type="date"/>
        <br></br>
        <label>CPF</label>
        <input type ="number">
        <br></br>
        <label>Você nos indicaria?</label>
        <input type="number" min ="1" max="5" />
        <br></br>
        <label>Email</label>
        <input type="email" placeholder="insira seu email" required/>
        <br></br>
        <Label>Cor Favorita</Label>
        <input type = "color"/>
        <br></br>
        <label>Em qual volume você escuta musica? (0 a 100)</label>
        <input Id = "volume" type="range" min="0" max="100" value="50" oninput="atualizarVolume(this.value)" style="accent-color: rgb(10, 157, 150);"/>
        <span id="valor-volume">50</span>
        <br></br>
        <fieldset>
            <legend>Gênero</legend>
            <input type="radio" name = "genero" />
            <label>Masculino</label>
            <input type="radio" name = "genero"/
            <label>Feminino</label>
        </fieldset>
        <fieldset>
            <Legend>Monte seu lanche! 🍔</Legend>
            <input type="checkbox" id = "salada"/>
            <label>salada</label>
            <input type="checkbox" id = "hamburguer"/>
            <label>hamburguer</label>
            <input type="checkbox" id = "bacon"/>
            <label>bacon</label>
            <input type="checkbox" id = "maionese"/>
            <label>maionese caseira da casa</label>
        </fieldset>
        <br></br>

        <br></br>
        <label>Senha</label>
        <input type="password" placeholder="insira sua senha" required/>
        <br></br>
        <label>informe a cidade</label>
        <select id = "Cidade">
            <option>Jaguariuna</option>
            <option>Pedreira</option>
            <option>Amparo</option>
            <option>Arcadas</option>
            <option>Bragança Paulista</option>
            <option>Serra Negra</option>
        </select>
        <br></br>
        <input type ="reset" value="Limpar form"/>
        <input type = "submit"/>
    </form>
    <script>
        function atualizarVolume(valor) {
            document.getElementById("valor-volume").textContent = valor;
        }
    </script>

</body>
</html>
